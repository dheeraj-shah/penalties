<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111b19"><title>Penalties · Play it your way</title><meta name="description" content="Ten kicks. Your rules. A small football game you can customize with Qwen on Cerebras."><link rel="stylesheet" href="/penalties/style.css"></head><body>
<header><a class="brand" href="/penalties" aria-label="Penalties home"><span class="mark">↗</span> penalties<span class="dot">.</span></a><div class="powered"><strong>Qwen × Cerebras</strong></div><a class="home" href="https://dheerajshah.com">by Dheeraj ↗</a></header>
<main><section class="game-panel" aria-label="Penalty game"><div class="game-heading"><div><h1>Build your own football game</h1></div><button id="restart" class="text-button" title="Restart round">↻ New round</button></div>
<div class="arena"><div class="scoreboard"><div><span class="label">GOALS</span><strong id="score">0</strong></div><div class="divider"></div><div><span class="label">ATTEMPTS LEFT</span><strong id="remaining">10</strong></div><div id="streak-wrap" hidden><span class="label">STREAK</span><strong id="streak">0</strong></div></div><canvas id="pitch" width="1000" height="610" role="img" aria-label="A football penalty spot facing a goalkeeper and goal"></canvas><div class="result" id="result" role="status" aria-live="polite">Pick your corner.</div><div class="round-dots" id="round-dots" aria-label="Shot results"></div></div>
<div id="change-feedback" class="change-feedback" role="status" aria-live="polite" hidden></div><div class="controls"><div class="control-row"><span class="control-label"><b>Shot</b></span><div class="shot-options" id="shots"></div></div><div class="control-row aim-row"><span class="control-label"><b>Aim</b></span><div class="aim-options" aria-label="Aim"><button data-aim="left" aria-pressed="false">↖ Left</button><button data-aim="centre" aria-pressed="true">↑ Centre</button><button data-aim="right" aria-pressed="false">↗ Right</button></div><button id="shoot" class="shoot-button">Shoot <span>↗</span></button></div></div></section>
<aside class="chat-panel"><div class="chat-head"><span class="ai-mark">✳</span><div><h2>Change the game</h2></div><button class="icon-button" id="clear-chat" title="Clear chat history" aria-label="Clear chat history">⌫</button></div><div class="connection" id="connection" role="status">Checking AI connection…</div><div class="history" id="history" role="log" aria-label="Your requests and applied changes" aria-live="polite"></div><div class="composer"><div class="suggestion-head"><span></span><button id="more" class="text-button">More ideas ↻</button></div><div id="suggestions" class="suggestions"></div><form id="chat-form"><label class="sr-only" for="prompt">Describe a game change</label><textarea id="prompt" maxlength="400" rows="2" placeholder="Make the ball pink…"></textarea><button id="send" type="submit" aria-label="Send game change">↑</button></form><p class="privacy">Requests go to Cerebras. AI canvas code runs isolated in your browser. Don’t include private information.</p><button id="reset-settings" class="reset-settings">Reset game settings</button><button id="undo-code" class="reset-settings" hidden>Undo generated change</button></div></aside></main><script type="module" src="/penalties/app.js"></script></body></html>
